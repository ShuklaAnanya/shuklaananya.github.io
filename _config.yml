# Jekyll + al-folio foundation; purpose-built research layout.
title: Ananya Shukla
first_name: Ananya
last_name: Shukla
url: https://shuklaananya.github.io
baseurl: ""
lang: en
description: >-
  Ananya Shukla is a Research Fellow with the M365 Copilot team at Microsoft,
  working on Self-Evolving Agents and Recursive Self-Improvement.
markdown: kramdown
highlighter: rouge
max_width: 860px
include: [_pages]
# Keep template examples in source without publishing them as Ananya's work.
exclude:
  - _posts
  - _projects
  - _books
  - _teachings
  - _news
  - _scripts
  - _pages/about_einstein.md
  - _pages/blog.md
  - _pages/books.md
  - _pages/dropdown.md
  - _pages/profiles.md
  - _pages/projects.md
  - _pages/repositories.md
  - _pages/teaching.md
  - assets/css
  - assets/fonts
  - assets/img
  - assets/plotly
  - assets/js
  - assets/json
  - assets/jupyter
  - assets/html
  - assets/video
  - assets/audio
  - assets/pdf/example_pdf.pdf
  - assets/bibliography
  - assets/img/publication_preview
  - assets/img/book_covers
  - assets/webfonts
  - bin
  - scripts
  - vendor
  - node_modules
  - tests
  - test-results
  - readme_preview
  - lighthouse_results
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - DESIGN.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - INSTALL.md
  - FAQ.md
  - LICENSE
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - requirements.txt
  - purgecss.config.js
keep_files: [CNAME, .nojekyll]
# Legacy al-folio plugins stay in source, but are unnecessary for this layout.
plugins_dir: []
plugins:
  - jekyll-scholar
  - jekyll-sitemap
sass:
  style: compressed
scholar:
  last_name: [Shukla]
  first_name: [Ananya]
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: research-publication
  style: apa
  locale: en
  sort_by: year
  order: descending
  group_by: none
  query: "@*"
  bibtex_filters: [latex, smallcaps, superscript]
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
