# Optional read-only audit of the published site. Reports never commit to source.
name: Audit published research site
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g lighthouse
      - run: lighthouse https://shuklaananya.github.io --chrome-flags="--headless --no-sandbox" --output=html --output-path=report.html
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: report.html
